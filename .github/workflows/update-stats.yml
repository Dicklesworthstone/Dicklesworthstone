name: Update GitHub Stats

# The daily schedule is intentionally disabled. Scheduled runs queue behind
# throttled GitHub Actions and get cut off, leaving the profile silently stale.
# The refresh now runs locally on mac-mini-max via the LaunchAgent
# com.jemanuel.profile-stats (~/.local/bin/profile-stats-update.sh), which
# executes this same update-stats.sh and pushes. This workflow is kept for
# manual dispatch as a fallback.
on:
  workflow_dispatch: {}   # Manual trigger only

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update all stats SVGs
        env:
          GH_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN || secrets.GITHUB_TOKEN }}
        run: bash update-stats.sh

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md stats.svg stats-light.svg languages.svg languages-light.svg star_history.svg star_history-light.svg
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update GitHub stats ($(date +%Y-%m-%d))"
            git push
          fi
